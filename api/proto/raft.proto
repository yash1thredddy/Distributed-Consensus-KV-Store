syntax = "proto3";

package raftpb;

option go_package = "github.com/yash1thredddy/Distributed-Consensus-KV-Store/api/proto/raftpb";

// LogEntry represents a single entry in the Raft log
message LogEntry {
  int64 term = 1;
  int64 index = 2;
  bytes command = 3;
}

// RequestVote RPC - used by candidates to gather votes
message RequestVoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

// AppendEntries RPC - used by leader for replication and heartbeats
message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
  int64 conflict_index = 4;
  int64 conflict_term = 5;
}

// InstallSnapshot RPC - used by leader to send snapshots to slow followers
message InstallSnapshotRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotResponse {
  int64 term = 1;
}

// Raft service definition
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}
