syntax = "proto3";

package kvpb;

option go_package = "github.com/yourusername/distributed-kv/api/proto/kvpb";

// Get RPC - Read a key
message GetRequest {
  string key = 1;
  bool linearizable = 2;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
  string error = 3;
}

// Put RPC - Write a key-value pair
message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  bool success = 1;
  string error = 2;
}

// Delete RPC - Delete a key
message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
  string error = 2;
}

// NodeInfo represents information about a single node
message NodeInfo {
  string id = 1;
  string address = 2;
  string state = 3;
  int64 term = 4;
  int64 commit_index = 5;
}

// ClusterInfo RPC - Get cluster status
message ClusterInfoRequest {
}

message ClusterInfoResponse {
  string leader_id = 1;
  repeated NodeInfo nodes = 2;
}

// KV service definition
service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc ClusterInfo(ClusterInfoRequest) returns (ClusterInfoResponse);
}
